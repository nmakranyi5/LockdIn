# Publishes the web build of the app to GitHub Pages.
#
# One-time setup:
#   1. Repo Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
#   2. Repo Settings -> Secrets and variables -> Actions -> Variables: add
#      EXPO_PUBLIC_SUPABASE_URL and EXPO_PUBLIC_SUPABASE_ANON_KEY (the anon key is
#      meant to be public; never use the service_role key).
#   3. Supabase -> Authentication -> URL Configuration: add the Pages address
#      (https://<user>.github.io/<repo>/) as the Site URL / a Redirect URL.
# It runs on every push to master, or by hand from the Actions tab.
name: Deploy web app to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Export the web app
        run: npx expo export --platform web
        env:
          # The site lives at /<repo name>/ on github.io.
          EXPO_BASE_URL: /${{ github.event.repository.name }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      - name: Prepare for GitHub Pages
        run: |
          touch dist/.nojekyll
          cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
